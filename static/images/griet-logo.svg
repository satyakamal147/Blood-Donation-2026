<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <!-- Outer Ring with Red Trim -->
  <circle cx="110" cy="110" r="102" fill="#ffffff" stroke="#8B0000" stroke-width="4"/>
  <circle cx="110" cy="110" r="95" fill="#fff9f9" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Top Arch Text -->
  <path id="grietTopPath" d="M 24,110 A 86,86 0 0,1 196,110" fill="none" />
  <text fill="#8B0000" font-size="10.5" font-family="'Arial Black', Impact, sans-serif" font-weight="bold" letter-spacing="1.2">
    <textPath href="#grietTopPath" startOffset="50%" text-anchor="middle">GOKARAJU RANGARAJU</textPath>
  </text>
  <!-- Bottom Arch Text -->
  <path id="grietBottomPath" d="M 196,110 A 86,86 0 0,1 24,110" fill="none" />
  <text fill="#8B0000" font-size="8.5" font-family="'Arial', sans-serif" font-weight="bold" letter-spacing="1.2">
    <textPath href="#grietBottomPath" startOffset="50%" text-anchor="middle">INSTITUTE OF ENGG &amp; TECH (1997)</textPath>
  </text>
  <!-- Leaves Laurel Wreath sides -->
  <path d="M 30,110 C 25,70 50,40 70,30 C 60,50 45,80 45,110 Z" fill="#8B0000" opacity="0.8"/>
  <path d="M 190,110 C 195,70 170,40 150,30 C 160,50 175,80 175,110 Z" fill="#8B0000" opacity="0.8"/>
  <!-- Inner Oval Badge -->
  <ellipse cx="110" cy="110" rx="60" ry="38" fill="#ffffff" stroke="#8B0000" stroke-width="2.5"/>
  <text x="110" y="116" fill="#dc2626" font-size="24" font-family="'Georgia', serif" font-weight="bold" font-style="italic" text-anchor="middle">Griet</text>
  <text x="110" y="132" fill="#71717a" font-size="8.5" font-family="'Arial', sans-serif" font-weight="bold" letter-spacing="1" text-anchor="middle">ESTD 1997</text>
</svg>
